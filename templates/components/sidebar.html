{% load i18n %}

<aside class="sidebar" id="sidebar" aria-label="{% trans 'Navigation principale' %}">
    <div class="sidebar-brand">
        <span class="sidebar-brand-icon" aria-hidden="true"><i class="ph-fill ph-books"></i></span>
        <div>
        <p class="sidebar-brand-name">{% trans "Bibliothèque" %}</p>
        <p class="sidebar-brand-sub">{% trans "Espace de gestion" %}</p>
        </div>
    </div>

    <nav class="sidebar-nav" aria-label="{% trans 'Sections principales' %}">
        <p class="sidebar-section-title">{% trans "Catalogue" %}</p>
        <a href="{% url 'authors_list' %}" class="sidebar-link {% if active_section == 'authors' %}active{% endif %}">
        <i class="ph ph-users"></i><span>{% trans "Auteurs" %}</span>
        </a>
        <a href="{% url 'get_all_books' %}" class="sidebar-link {% if active_section == 'books' %}active{% endif %}">
        <i class="ph ph-books"></i><span>{% trans "Livres" %}</span>
        </a>
        <a href="{% url 'loan_list' %}" class="sidebar-link {% if active_section == 'loans' %}active{% endif %}">
        <i class="ph ph-arrows-left-right"></i><span>{% trans "Emprunts" %}</span>
        </a>
        <p class="sidebar-section-title">{% trans "Système" %}</p>
        <a href="#" class="sidebar-link"><i class="ph ph-gear-six"></i><span>{% trans "Administration" %}</span></a>
    </nav>

    <div class="sidebar-footer">
        <p>{% trans "Connecté en tant que" %} <strong style="color:#fff">{% trans "Bibliothécaire" %}</strong></p>
    </div>
</aside>
