{% load i18n %}
{% load tailwind_tags %}
{% tailwind_css %}

<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <main class="min-h-screen flex items-center justify-center px-6">
        <div class="text-center max-w-md mx-auto">
            <span class="text-indigo-600 font-bold text-sm tracking-widest uppercase bg-indigo-50 px-3 py-1 rounded-full">{% trans "Erreur 404" %}</span>
            
            <h1 class="mt-4 text-5xl sm:text-6xl font-extrabold tracking-tight text-slate-900">
                {% trans "Page introuvable" %}
            </h1>
            
            <p class="mt-4 text-base text-slate-600 leading-relaxed">
                {% trans "Désolé, la page que vous cherchez n'existe pas ou a été déplacée vers une autre adresse." %}
            </p>
            
            <div class="mt-8 flex items-center justify-center">
                <a href="/" class="inline-flex items-center justify-center px-5 py-3 text-sm font-medium text-white bg-indigo-600 rounded-xl shadow-sm hover:bg-indigo-700 transition-colors duration-200">
                    {% trans "Retour à l'accueil" %}
                </a>
            </div>
        </div>
    </main>
</body>
