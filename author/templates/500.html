{% load tailwind_tags %}
{% tailwind_css%}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable - 404</title>
    <!-- Script Tailwind CSS -->
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <main class="min-h-screen flex items-center justify-center px-6">
        <div class="text-center max-w-md mx-auto">
            <!-- Numéro d'erreur stylisé -->
            <span class="text-indigo-600 font-bold text-sm tracking-widest uppercase bg-indigo-50 px-3 py-1 rounded-full">Erreur 404</span>
            
            <h1 class="mt-4 text-5xl sm:text-6xl font-extrabold tracking-tight text-slate-900">
                Page introuvable
            </h1>
            
            <p class="mt-4 text-base text-slate-600 leading-relaxed">
                Désolé, la page que vous cherchez n'existe pas ou a été déplacée vers une autre adresse.
            </p>
            
            <!-- Bouton d'action -->
            <div class="mt-8 flex items-center justify-center">
                <a href="/" class="inline-flex items-center justify-center px-5 py-3 text-sm font-medium text-white bg-indigo-600 rounded-xl shadow-sm hover:bg-indigo-700 transition-colors duration-200">
                    Retour à l'accueil
                </a>
            </div>
        </div>
    </main>
</body>
</html>
